<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>校园通知 · 日程</title>
    <link rel="icon" href="/icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8a6 6 0 1 0-12 0c0 6-2.5 7-2.5 7h17S18 14 18 8" />
          <path d="M10.3 20a2 2 0 0 0 3.4 0" />
        </svg>
        <div>
          <h1>校园通知 · 日程</h1>
          <p id="status-line">正在读取数据…</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="btn-notify" class="btn ghost" title="允许后，日程到点会弹系统通知">开启桌面通知</button>
        <button id="btn-poll" class="btn primary">立即抓取</button>
      </div>
    </header>

    <nav id="tabs" class="tabs" aria-label="分区"></nav>
    <main id="view" class="view"></main>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
